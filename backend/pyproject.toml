[project]
name = "jarvis-backend"
version = "0.1.0"
description = "Local brain and hands for the Jarvis assistant (Phase 0: chat over localhost)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "websockets>=13",
    # Phase 1 speech: STT (faster-whisper), TTS (Kokoro via onnxruntime), audio
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "numpy>=2.0",
    "kokoro-onnx>=0.4.7",
    # Phase 2 always-listening: offline wake word (bundles a Silero VAD model)
    "openwakeword>=0.6",
]

# Classic pip extra so `pip install -e ".[dev]"` (as documented in the README)
# works on older pip; kept alongside the PEP 735 group below.
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
